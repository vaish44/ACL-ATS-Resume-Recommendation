{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center py-md-4">
  <div class="col-sm-10 col-md-7 col-lg-5">
    <div class="card card-soft p-4 p-md-5">
      <h1 class="h3 fw-bold mb-1">Welcome back</h1>
      <p class="text-body-secondary mb-4">Log in to your candidate or hirer account.</p>
      <form method="post" novalidate>
        {{ csrf() }}
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" value="{{ email }}" required autofocus autocomplete="email">
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" data-toggle-password="password" aria-label="Show password"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">Log in</button>
      </form>
      <p class="text-center small mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
  </div>
</div>
{% endblock %}
